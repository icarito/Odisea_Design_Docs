project:
  type: book
  output-dir: outputs
  resources:
  - Odisea/_ASSETS/*
book:
  title: 'Odisea: El Arca Silenciosa'
  author: Equipo Odisea
  date: last-modified
  sidebar:
    collapse-level: 1
  chapters:
  - index.qmd
  - Odisea/index.md
  - Odisea/Master_Index.md
  - Odisea/GDD_v3.md
  - part: Anexos - Mecánicas
    chapters:
    - Odisea/Anexos/Mecanicas/02_Mecanicas_Clave.md
    - Odisea/Anexos/Mecanicas/Mecanicas_Controlador_Elias.md
    - Odisea/Anexos/Mecanicas/Mecanicas_Dron_Cargol.md
    - Odisea/Anexos/Mecanicas/Enemigos_Drones_y_Sistemas.md
    - Odisea/Anexos/Mecanicas/Mecanicas_Herramienta_Mantenimiento.md
    - Odisea/Anexos/Mecanicas/Input.md
  - part: Anexos - Narrativa
    chapters:
    - Odisea/Anexos/Narrativa/Acto_I_La_Negacion.md
    - Odisea/Anexos/Narrativa/Locacion_Criogenia.md
    - Odisea/Anexos/Narrativa/Personaje_Elias.md
    - Odisea/Anexos/Narrativa/Personaje_IA_Odisea.md
    - Odisea/Anexos/Narrativa/Entidad_Cargol.md
  - part: Anexos - Level Design
    chapters:
    - Odisea/Anexos/LevelDesign/Level_Design_Document.md
    - Odisea/Anexos/LevelDesign/Pipeline.md
    - Odisea/Anexos/LevelDesign/Screenplay_Nivel_1.md
    - Odisea/Anexos/LevelDesign/Storyboard_Nivel_1.md
    - Odisea/Anexos/LevelDesign/Deep_Research_Level_Design.md
  - part: Anexos - Canon
    chapters:
    - Odisea/Anexos/Canon/feature_interact.md
    - Odisea/Anexos/Canon/feature_interactables.md
    - Odisea/Anexos/Canon/feature_odisea_script.md
    - Odisea/Anexos/Canon/feature_odyssey_script_replay.md
    - Odisea/Anexos/Canon/feature_odyssey_script_usage.md
    - Odisea/Anexos/Canon/feature_pushable_box.md
    - Odisea/Anexos/Canon/feature_refine_movement_gamefeel.md
format:
  html:
    theme: darkly
    css: style.css
    toc: true
    toc-depth: 3
    toc-title: "Contenido"
    number-sections: false
    smooth-scroll: true
    code-copy: true
    link-external-icon: true
    link-external-newwindow: true
    include-after-body: _footer.html
    page-footer:
      left: "Odisea: El Arca Silenciosa"
      right: "[GitHub](https://github.com/icarito/Odisea_Design_Docs)"
  pdf:
    pdf-engine: xelatex
    output-file: Odisea.pdf
    toc: true
    number-sections: true
    colorlinks: true
    documentclass: scrbook
    papersize: a4
    geometry:
    - top=25mm
    - left=25mm
    - right=25mm
    - bottom=25mm
filters:
- quarto/filters/obsidian-callouts.lua
- quarto/filters/obsidian-wikilinks-images.lua
