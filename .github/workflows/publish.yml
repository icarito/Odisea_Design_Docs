on:
  push:
    branches: main
  pull_request:
    branches: main

name: Render and Publish

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Generate Orphaned Images Appendix
        run: python3 scripts/generate_orphaned_appendix.py

      - name: Generate footer with commit info
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          COMMIT_DATE=$(git log -1 --format="%Y-%m-%d %H:%M UTC")
          COMMIT_MSG=$(git log -1 --format="%s" | cut -c1-60)
          cat > _footer.html << EOF
          <div style="margin-top:3em; padding:1em 0; border-top:1px solid rgba(0,180,255,0.15); font-family:'Share Tech Mono',monospace; font-size:0.78em; color:#4a6a7a; text-align:center;">
            Publicado desde commit
            <a href="https://github.com/icarito/Odisea_Design_Docs/commit/${{ github.sha }}" style="color:#40a0d0; border:none;">
              <code>${SHORT_SHA}</code>
            </a>
            · ${COMMIT_DATE} · ${COMMIT_MSG}
          </div>
          EOF

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        # No 'to' input means render all formats defined in _quarto.yml (html and pdf)

      - name: Verify PDF Existence
        run: |
          # Check if PDF exists in expected location
          if [ -f outputs/Odisea.pdf ]; then
            echo "PDF found in outputs/Odisea.pdf"
          elif [ -f Odisea.pdf ]; then
            echo "PDF found in root, moving to outputs/"
            mv Odisea.pdf outputs/
          else
            echo "PDF not found!"
            find . -name "*.pdf"
          fi

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./outputs
